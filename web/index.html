<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F1E8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14110D" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="The Sand Gallery: a gallery of everything you make, with the time it took." />
    <title>The Sand Gallery</title>
    <script>
      try {
        var t = localStorage.getItem('sg.theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.style = localStorage.getItem('sg.style') === 'glossy' ? 'glossy' : 'flat';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
